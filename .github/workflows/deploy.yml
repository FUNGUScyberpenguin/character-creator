name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        # Pages serves the site from /<repo>/, so the bundle needs that prefix.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Serve index.html for unknown paths
        run: cp dist/index.html dist/404.html

      # `enablement` turns Pages on the first time this runs, so the repository
      # needs no manual setup — the `pages: write` permission above is what
      # allows it. Pages must be available for the repository: that means public,
      # or private on a plan that includes it.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
